<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolt</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/particles.js"></script>
</head>
<body>
    <div id="particles-js"></div>

    <header class="floating-header">
        <div class="header-left">
            <div class="logo-box">
                <img src="Revolt.png" alt="Logo" class="logo">
            </div>
            <h1 class="header-title">Revolt</h1>
        </div>
        
        <form id="search-form" class="search-container">
            <span class="search-prefix">Revolt://</span>
            <input type="text" id="search-input" name="q" class="search-bar" placeholder="Search or enter URL..." autocomplete="off">
            <button type="submit" class="search-btn">&gt;</button>
        </form>

        <button id="sidebar-toggle" class="header-square-btn">
            <i data-lucide="menu"></i>
        </button>
    </header>

    <div class="tab-bar-container">
        <div id="tab-bar" class="tab-bar">
            <div class="tab active" data-id="tab-1">
                <span class="tab-title">RT1</span>
                <i data-lucide="x" class="tab-close"></i>
            </div>
        </div>
    </div>

    <main class="content-wrapper">
        <div id="home-view" class="home-view">
            <div id="clock" class="time-display">00:00:00 AM</div>

            <div class="app-grid">
                <div class="app-item">
                    <div class="app-icon floating-btn"><i data-lucide="cpu"></i></div>
                    <span class="app-name">AI</span>
                </div>
                <div class="app-item">
                    <div class="app-icon floating-btn"><i data-lucide="message-square"></i></div>
                    <span class="app-name">Chat</span>
                </div>
                <div class="app-item">
                    <div class="app-icon floating-btn"><i data-lucide="gamepad-2"></i></div>
                    <span class="app-name">Games</span>
                </div>
                <div class="app-item">
                    <div class="app-icon floating-btn"><i data-lucide="layout-grid"></i></div>
                    <span class="app-name">Apps</span>
                </div>
                <div class="app-item">
                    <div class="app-icon floating-btn"><i data-lucide="monitor-play"></i></div>
                    <span class="app-name">Watch</span>
                </div>
                <div class="app-item">
                    <div class="app-icon floating-btn"><i data-lucide="settings"></i></div>
                    <span class="app-name">Settings</span>
                </div>
            </div>
        </div>

        <iframe id="viewport" class="viewport hidden" src="about:blank"></iframe>
    </main>

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Menu</span>
            <button id="sidebar-close" class="sidebar-close-btn">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="sidebar-item" id="btn-home">Home</div>
        <div class="sidebar-item" id="btn-new-tab">New Tab</div>
        <div class="sidebar-item" id="btn-close-tab">Close Tab</div>
        <div class="sidebar-item" id="btn-fullscreen">FullScreen</div>
        <div class="sidebar-item" id="btn-reload">Reload</div>
    </aside>

    <script src="js/script.js"></script>
</body>
</html>
