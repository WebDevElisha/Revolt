<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk - REVOLT</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #auth-check-loader {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff0000;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #auth-section {
            display: none; 
            background-color: #0a0a0a;
            padding: 2.5rem;
            border-radius: 16px; 
            border: 1px solid #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            text-align: center;
            width: 320px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        #auth-section:hover {
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
        }
        
        #auth-section h1 {
            color: #ff0000;
            margin-top: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        #auth-section p {
            color: #888888;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        
        #auth-section input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border: 1px solid #333;
            border-radius: 8px; 
            background-color: #111;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s, background-color 0.3s;
        }
        
        #auth-section input:hover {
            background-color: #1a1a1a;
        }

        #auth-section input:focus {
            border-color: #ff0000;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
            background-color: #111;
        }
        
        #auth-section button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px; 
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            background-color: #ff0000;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        #auth-section button:hover {
            background-color: #cc0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
            transform: translateY(-2px);
        }
        
        .toggle-text {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #aaaaaa;
        }
        
        .toggle-text span {
            color: #ff0000;
            cursor: pointer;
            font-weight: bold;
            transition: color 0.2s;
        }
        
        .toggle-text span:hover {
            color: #ff4d4d;
            text-decoration: underline;
        }

        #chat-section {
            display: none;
            width: 96vw;
            height: 94vh;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            border: 1px solid #ff0000;
            border-radius: 16px; 
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
            background-color: #050505;
            transition: box-shadow 0.3s;
        }

        .header:hover {
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h2 {
            color: #ff0000;
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 2px;
        }

        #logout-btn {
            background: none;
            border: 1px solid #ff0000;
            color: #ff0000;
            padding: 8px 18px;
            border-radius: 8px; 
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        #logout-btn:hover {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
            transform: scale(1.05);
        }

        .main-content {
            display: flex;
            flex: 1;
            gap: 15px;
            min-height: 0;
        }

        .panel {
            border: 1px solid #ff0000;
            border-radius: 16px; 
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
            background-color: #050505;
            display: flex;
            flex-direction: column;
            padding: 15px;
            transition: box-shadow 0.3s;
        }

        .panel:hover {
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        .panel h3 {
            color: #ff0000;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid #330000;
            padding-bottom: 8px;
        }

        .rooms-panel {
            width: 220px;
        }

        .room-item {
            color: #888;
            padding: 12px 15px;
            cursor: pointer;
            margin-bottom: 8px;
            border-radius: 8px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .room-item:hover:not(.active) {
            background-color: #1a0505;
            color: #ff4d4d;
            padding-left: 25px;
            box-shadow: inset 2px 0 0 #ff0000;
        }

        .room-item.active {
            color: #ff0000;
            background-color: #1a0000;
            border-left: 4px solid #ff0000;
            font-weight: bold;
        }

        .chat-panel {
            flex: 1;
            padding: 0;
            overflow: hidden;
        }

        #messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 65%;
            padding: 12px 18px;
            border-radius: 16px; 
            border: 1px solid #ff0000;
            box-shadow: 0 0 5px rgba(255, 0, 0, 0.2);
            background-color: #111;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .message:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 0, 0, 0.3);
        }

        .message.me {
            align-self: flex-end;
            border-color: #ff0000;
            border-bottom-right-radius: 4px; 
            background-color: #1a0505;
        }

        .message.other {
            align-self: flex-start;
            border-color: #550000;
            border-bottom-left-radius: 4px; 
        }

        .message .sender {
            color: #ff0000;
            font-size: 0.8rem;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .message .text {
            color: #ddd;
            font-size: 0.95rem;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .input-container {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ff0000;
            gap: 10px;
            background-color: #0a0a0a;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
        }

        #message-input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #550000;
            border-radius: 12px; 
            background-color: #000;
            color: white;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-size: 1rem;
        }

        #message-input:hover {
            border-color: #880000;
        }

        #message-input:focus {
            border-color: #ff0000;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
        }

        #send-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 12px; 
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        #send-btn:hover {
            background-color: #cc0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
            transform: scale(1.05);
        }

        .users-panel {
            width: 250px;
        }

        #total-users {
            color: #ff0000;
            font-size: 0.9rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .user-item {
            color: #ddd;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px; 
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .user-item:hover {
            background-color: #1a0000;
            transform: translateX(5px);
            color: #fff;
        }

        .user-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #00ff00;
            box-shadow: 0 0 8px #00ff00;
        }

        .hidden {
            display: none !important;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #550000; 
            border-radius: 4px;
            transition: background 0.3s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff0000; 
        }
    </style>
</head>
<body>

    <div id="auth-check-loader">
        Initializing...
    </div>

    <div id="auth-section">
        <h1>Join the REVOLT!</h1>
        <p id="auth-subtitle">Sign in to your existing account.</p>
        
        <input type="text" id="username-input" placeholder="Username" class="hidden">
        <input type="email" id="email-input" placeholder="Email address" required>
        <input type="password" id="password-input" placeholder="Password" required>
        
        <button id="main-auth-btn">Log In</button>
        
        <div class="toggle-text" id="toggle-auth-mode">
            Need an account? <span>Sign Up</span>
        </div>
    </div>

    <div id="chat-section">
        <div class="header">
            <div class="header-left">
                <h2>REVOLT</h2>
            </div>
            <div class="header-right">
                <button id="logout-btn">Log Out</button>
            </div>
        </div>
        
        <div class="main-content">
            <div class="panel rooms-panel">
                <h3>Rooms</h3>
                <div class="room-item active">General</div>
            </div>
            
            <div class="panel chat-panel">
                <div id="messages-container"></div>
                <div class="input-container">
                    <input type="text" id="message-input" placeholder="Type a message..." maxlength="250">
                    <button id="send-btn"><i data-lucide="corner-down-left"></i></button>
                </div>
            </div>
            
            <div class="panel users-panel">
                <h3>Revolt Counter</h3>
                <div id="total-users">Total Users: 0</div>
                <div id="users-list"></div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/talk.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
