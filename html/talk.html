<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk - REVOLT</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #auth-section {
            background-color: #1e1e1e;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 320px;
        }
        h1 {
            color: #ff3366;
            margin-top: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #aaaaaa;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border: 1px solid #333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #ff3366;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.8;
        }
        #login-btn {
            background-color: #4CAF50;
            color: white;
        }
        #signup-btn {
            background-color: #2196F3;
            color: white;
        }
        #chat-section {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="auth-section">
        <h1>Join the REVOLT!</h1>
        <p>Sign in or create an account to start chatting.</p>
        <input type="text" id="username-input" placeholder="Username (for Sign Up)" required>
        <input type="email" id="email-input" placeholder="Email address" required>
        <input type="password" id="password-input" placeholder="Password" required>
        <button id="login-btn">Log In</button>
        <button id="signup-btn">Sign Up</button>
    </div>
    <div id="chat-section">
        <h2>Welcome to the Chat</h2>
        <button id="logout-btn" style="width: auto; padding: 10px; background: #f44336;">Log Out</button>
    </div>
    <script type="module" src="../js/talk.js"></script>
</body>
</html>
