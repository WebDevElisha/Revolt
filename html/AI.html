<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolt AI</title>
    <link rel="stylesheet" href="../css/AI.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="ai-container">
        <aside class="chats-panel">
            <div class="panel-header">
                <span class="panel-title">Chats</span>
                <button id="btn-new-chat" class="new-chat-btn" title="New Chat">
                    <i data-lucide="plus"></i>
                </button>
            </div>
            <div id="saved-chats-list" class="saved-chats-list">
            </div>
        </aside>

        <main class="chat-section">
            <div id="chat-history" class="chat-history">
                <div class="message system-msg">
                    <p>Revolt AI initialized. How can I assist you today?</p>
                </div>
            </div>

            <form id="ai-input-form" class="ai-input-container">
                <input type="text" id="ai-user-input" class="ai-input" placeholder="Type a message..." autocomplete="off" required>
                <button type="submit" class="ai-send-btn" title="Send">
                    <i data-lucide="corner-down-left"></i>
                </button>
            </form>
        </main>
    </div>

    <div id="rename-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <p class="modal-title">Do you want to rename this chat?</p>
            <input type="text" id="rename-input" class="modal-input" autocomplete="off">
            <div class="modal-actions">
                <button id="btn-cancel-rename" class="modal-btn cancel-btn">Cancel</button>
                <button id="btn-confirm-rename" class="modal-btn confirm-btn">Confirm</button>
            </div>
        </div>
    </div>

    <script src="../js/AI.js"></script>
</body>
</html>
