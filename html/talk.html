<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk - REVOLT</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #auth-section {
            background-color: #141414;
            padding: 2.5rem;
            border-radius: 8px;
            border: 1px solid #ff0033;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.2);
            text-align: center;
            width: 320px;
        }
        h1 {
            color: #ff0033;
            margin-top: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #888888;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border: 1px solid #333;
            border-radius: 4px;
            background-color: #1e1e1e;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #ff0033;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            background-color: #ff0033;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background-color: #cc0029;
            box-shadow: 0 0 10px rgba(255, 0, 51, 0.5);
        }
        .toggle-text {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #aaaaaa;
        }
        .toggle-text span {
            color: #ff0033;
            cursor: pointer;
            font-weight: bold;
        }
        .toggle-text span:hover {
            text-decoration: underline;
        }
        #chat-section {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="auth-section">
        <h1>Join the REVOLT!</h1>
        <p id="auth-subtitle">Sign in to your existing account.</p>
        
        <input type="text" id="username-input" placeholder="Username" class="hidden">
        <input type="email" id="email-input" placeholder="Email address" required>
        <input type="password" id="password-input" placeholder="Password" required>
        
        <button id="main-auth-btn">Log In</button>
        
        <div class="toggle-text" id="toggle-auth-mode">
            Need an account? <span>Sign Up</span>
        </div>
    </div>

    <div id="chat-section">
        <h2 style="color: #ff0033;">Welcome to the Chat</h2>
        <button id="logout-btn" style="width: auto; padding: 10px 20px;">Log Out</button>
    </div>

    <script type="module" src="../js/talk.js"></script>
</body>
</html>
