<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolt</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/particles.js"></script>
</head>
<body>
    <div id="particles-js"></div>

    <div class="app-layout">
        <aside class="left-sidebar">
            <div class="sidebar-logo">
                <img src="Revolt.png" alt="Logo" class="logo">
            </div>

            <nav class="sidebar-nav">
                <button class="nav-btn" id="nav-ai" title="AI">
                    <i data-lucide="cpu"></i>
                </button>
                <button class="nav-btn" id="nav-chat" title="Chat">
                    <i data-lucide="message-square"></i>
                </button>
                <button class="nav-btn" id="nav-games" title="Games">
                    <i data-lucide="gamepad-2"></i>
                </button>
                <button class="nav-btn" id="nav-apps" title="Apps">
                    <i data-lucide="layout-grid"></i>
                </button>
                <button class="nav-btn" id="nav-watch" title="Watch">
                    <i data-lucide="monitor-play"></i>
                </button>
                <button class="nav-btn" id="nav-music" title="Music">
                    <i data-lucide="music"></i>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button class="nav-btn" id="sidebar-toggle" title="Menu">
                    <i data-lucide="menu"></i>
                </button>
            </div>
        </aside>

        <div class="main-container">
            <div class="tab-bar-container">
                <div id="tab-bar" class="tab-bar">
                    <div class="tab active" data-id="tab-1">
                        <span class="tab-title">RT1</span>
                        <i data-lucide="x" class="tab-close"></i>
                    </div>
                </div>
                <button id="add-tab-btn" class="add-tab-btn" title="New Tab">
                    <i data-lucide="plus"></i>
                </button>
            </div>

            <main class="content-wrapper">
                <div id="home-view" class="home-view">
                    <!-- The Big R has been removed here! -->
                    <div class="revolt-brand">
                        Revolt
                    </div>

                    <form id="search-form" class="search-container">
                        <span class="search-prefix">Revolt://</span>
                        <input type="text" id="search-input" name="q" class="search-bar" placeholder="Search DuckDuckGo or type URL..." autocomplete="off">
                        <button type="submit" class="search-btn">&gt;</button>
                    </form>

                    <div id="clock" class="time-display">00:00:00 AM</div>
                </div>

                <iframe id="viewport" class="viewport hidden" src="about:blank"></iframe>
            </main>
        </div>
    </div>

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Menu</span>
            <button id="sidebar-close" class="sidebar-close-btn">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="sidebar-item" id="btn-home">Home</div>
        <div class="sidebar-item" id="btn-new-tab">New Tab</div>
        <div class="sidebar-item" id="btn-close-tab">Close Tab</div>
        <div class="sidebar-item" id="btn-fullscreen">FullScreen</div>
        <div class="sidebar-item" id="btn-reload">Reload</div>
    </aside>

    <script src="js/script.js"></script>
</body>
</html>
