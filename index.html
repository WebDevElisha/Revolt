<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolt</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header class="floating-header">
        <div class="header-left">
            <div class="logo-box">
                <img src="Revolt.png" alt="Logo" class="logo">
            </div>
            <h1 class="header-title">Revolt</h1>
        </div>
        
        <form class="search-container" action="https://duckduckgo.com/" method="GET">
            <input type="text" name="q" class="search-bar" placeholder="Browse thru Revolt using DuckDuckGo!">
            <button type="submit" class="search-btn">&gt;</button>
        </form>

        <button id="sidebar-toggle" class="header-square-btn">
            <i data-lucide="menu"></i>
        </button>
    </header>

    <main class="content-wrapper">
        <div id="clock" class="time-display">00:00:00 AM</div>

        <div class="app-grid">
            <div class="app-item">
                <div class="app-icon"><i data-lucide="cpu"></i></div>
                <span class="app-name">AI</span>
            </div>
            <div class="app-item">
                <div class="app-icon"><i data-lucide="message-square"></i></div>
                <span class="app-name">Chat</span>
            </div>
            <div class="app-item">
                <div class="app-icon"><i data-lucide="gamepad-2"></i></div>
                <span class="app-name">Games</span>
            </div>
            <div class="app-item">
                <div class="app-icon"><i data-lucide="layout-grid"></i></div>
                <span class="app-name">Apps</span>
            </div>
            <div class="app-item">
                <div class="app-icon"><i data-lucide="monitor-play"></i></div>
                <span class="app-name">Watch</span>
            </div>
            <div class="app-item">
                <div class="app-icon"><i data-lucide="settings"></i></div>
                <span class="app-name">Settings</span>
            </div>
        </div>
    </main>

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-item">New Tab</div>
        <div class="sidebar-item">FullScreen</div>
        <div class="sidebar-item">Reload</div>
    </aside>

    <script src="js/script.js"></script>
</body>
</html>
